# Force new deployment with timestamp
steps:
  # Build Frontend with timestamp
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/parliament-frontend:${BUILD_ID}'
      - '.'

  # Deploy Frontend to Cloud Run with new image
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'parliament-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/parliament-frontend:${BUILD_ID}'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--no-traffic'

  # Update traffic to new revision
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'parliament-frontend'
      - '--to-latest'
      - '--region'
      - 'us-west1'