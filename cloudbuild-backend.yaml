# Backend Only Cloud Build Configuration
steps:
  # Build Backend API
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/parliament-api:latest'
      - './cloud-run-api'

  # Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'parliament-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/parliament-api:latest'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,SINGLE_USER_MODE=true'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'