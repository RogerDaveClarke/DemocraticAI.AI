name: Security Scan (React & Google Services)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  security-audit:
    name: Run Security Verification
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the source code
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0 # TruffleHog needs full history to scan commits

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: 'npm'

      # Step 3: Install pinned security tooling used by repository verification
      - name: Install Semgrep (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install semgrep==1.85.0

      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Step 4: Scan repository history for leaked Google/Firebase secrets
      - name: Secret Detection (TruffleHog)
        uses: trufflesecurity/trufflehog@1ea7fc1960b818e3c3ac3984f85922e3acba4061
        with:
          path: ./
          extra_args: --debug --only-verified

      # Step 5: Run repository-owned canonical verification command
      - name: Repository Security Verification
        run: |
          npm ci
          npm run verify:repo-security
