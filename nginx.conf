# Parliament Explorer - Optimized NGINX Configuration for Cloud Run
# Configured for OAuth-only React SPA with API backend

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set $cache_control "";
    set $pragma_header "";
    set $expires_header "";

    # Security headers for OAuth authentication
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://login.microsoftonline.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com https://login.microsoftonline.com https://graph.microsoft.com https://*.run.app;";
    add_header Cache-Control $cache_control;
    add_header Pragma $pragma_header;
    add_header Expires $expires_header;

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css text/plain text/xml application/xml application/xml+rss text/javascript;

    # Redirect legacy document-style URLs to canonical SPA routes.
    location = /index.html {
        if ($request_uri ~ ^/index\.html(?:\?|$)) {
            return 301 /;
        }
    }

    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    # Handle React Router (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache policy for HTML files (no cache for SPA).
        set $cache_control "no-cache, no-store, must-revalidate";
        set $pragma_header "no-cache";
        set $expires_header "0";
    }

    # Cache static assets for performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        set $cache_control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Health check endpoint for Cloud Run
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
    
    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    # Security: Hide nginx version
    server_tokens off;
    
    # Optimize for Cloud Run
    keepalive_timeout 650;
    keepalive_requests 10000;
}
